<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>Monument Row</title>
<meta name="theme-color" content="#7ec3e8" />
<!-- iOS PWA / home-screen app -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Monument Row" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div id="topbar" class="hide-back">
  <button id="btn-back" class="mr-btn small">◀ MENU</button>
  <span class="bar-spacer"></span>
  <button id="btn-sound" class="mr-btn small">♪ ON</button>
</div>

<!-- HOME -->
<section id="screen-home" class="screen active">
  <div class="logo">
    <div class="logo-obelisk">▲<span></span></div>
    <div class="logo-l1">MONUMENT</div>
    <div class="logo-l2">ROW</div>
    <div class="logo-sub">BUILD THE PRESIDENTS' TIMELINE — ONE MONUMENT AT A TIME</div>
  </div>
  <div class="home-buttons">
    <button id="btn-play" class="mr-btn primary">▶ START BUILDING</button>
    <button id="btn-mall" class="mr-btn">🏛 VISIT THE MALL</button>
    <div class="challenge-row">
      <button id="btn-gap" class="mr-btn half">🔍 GAP MASTER</button>
      <button id="btn-swap" class="mr-btn half">🚨 SWAP PATROL</button>
    </div>
    <div id="challenge-note" class="challenge-note"></div>
  </div>
  <div class="progress-box">
    <div id="home-rank" class="rank-chip">🏛 Apprentice</div>
    <div id="home-count">1 / 47 monuments built</div>
    <div class="home-bar"><div id="home-bar-fill"></div></div>
    <div id="home-xp">XP 0 • Best gold streak 0</div>
    <button id="btn-reset">tear it down (reset)</button>
  </div>
</section>

<!-- GAME -->
<section id="screen-game" class="screen">
  <div class="game-head">
    <span id="game-round">WING 1</span>
    <span id="game-streak">⚡0</span>
    <span id="game-progress">1 / 47</span>
  </div>
  <div id="deal-card"></div>
  <div id="game-ask" class="game-ask"></div>
  <div id="game-feedback" class="game-feedback"></div>
  <div id="row-strip" class="row-strip"></div>
  <div class="row-help">◀ scroll the Row · ▲ = place him there · tap a face for facts</div>
</section>

<!-- MALL -->
<section id="screen-mall" class="screen">
  <div class="section-title">THE MALL</div>
  <div id="mall-count" class="mall-count"></div>
  <div id="mall-rail"></div>
</section>

<!-- GAP MASTER -->
<section id="screen-gap" class="screen">
  <div class="section-title">GAP MASTER</div>
  <div id="gap-round" class="challenge-status"></div>
  <div class="game-ask">Someone's missing — who belongs in the “?” slot?</div>
  <div id="gap-strip" class="row-strip"></div>
  <div id="gap-options" class="options"></div>
</section>

<!-- SWAP PATROL -->
<section id="screen-swap" class="screen">
  <div class="section-title">SWAP PATROL</div>
  <div id="swap-round" class="challenge-status"></div>
  <div id="swap-ask" class="game-ask"></div>
  <div id="swap-strip" class="row-strip tall"></div>
</section>

<!-- shared fact modal -->
<div id="modal" class="overlay hidden">
  <div class="overlay-panel">
    <div id="modal-title" class="overlay-kicker"></div>
    <div id="modal-body"></div>
    <button id="modal-close" class="mr-btn primary">GOT IT ▶</button>
  </div>
</div>

<!-- shared banner (round intro / complete) -->
<div id="banner" class="overlay hidden">
  <div class="overlay-panel">
    <div id="banner-kicker" class="overlay-kicker"></div>
    <div id="banner-title" class="banner-title"></div>
    <div id="banner-sub" class="banner-sub"></div>
    <button id="banner-go" class="mr-btn primary">GO ▶</button>
  </div>
</div>

<div id="confetti"></div>

<script src="js/presidents.js"></script>
<script src="js/pixelart.js"></script>
<script src="js/game.js"></script>
</body>
</html>
