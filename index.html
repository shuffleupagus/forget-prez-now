<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>Ain't Never Gonna Forget Presidents Now</title>
<meta name="theme-color" content="#13110d" />
<!-- iOS PWA / home-screen app -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Forget Prez Now" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div id="topbar" class="hide-back">
  <button id="btn-back" class="mc-btn small">◀ MENU</button>
  <span class="bar-title"></span>
</div>

<!-- HOME -->
<section id="screen-home" class="screen active">
  <div class="logo">
    <span class="star">★</span>
    <span class="l1">AIN'T NEVER GONNA FORGET</span>
    <span class="l2">PRESIDENTS</span>
    <span class="l3">— NOW —</span>
  </div>
  <div class="home-buttons">
    <button id="btn-play" class="mc-btn green">▶ RAISE A GLASS (QUIZ)</button>
    <button id="btn-dex" class="mc-btn">📖 THE CAST (PREZ-DEX)</button>
    <button id="btn-timeline" class="mc-btn">🎭 THE TIMELINE</button>
  </div>
  <div class="progress-box">
    <div id="home-progress">0 / 47 presidents committed to memory</div>
    <div class="home-bar"><div id="home-bar-fill"></div></div>
    <div id="home-xp">Groups mastered 0/16 • XP 0 • Best streak 0</div>
    <button id="btn-reset">reset the show</button>
  </div>
</section>

<!-- PREZ-DEX -->
<section id="screen-dex" class="screen">
  <div class="section-title">THE CAST</div>
  <div id="dex-grid"></div>
</section>

<!-- DETAIL -->
<section id="screen-detail" class="screen">
  <div id="detail-body"></div>
</section>

<!-- QUIZ -->
<section id="screen-quiz" class="screen">
  <div class="quiz-head">
    <div id="quiz-group">NOW LEARNING #1–#3</div>
    <div id="quiz-pips"></div>
    <div id="quiz-score">Streak 0</div>
  </div>
  <div id="quiz-tag" class="quiz-tag new">NEW MATERIAL</div>
  <div id="quiz-icon"></div>
  <div id="quiz-prompt"></div>
  <div id="quiz-options"></div>
  <div id="quiz-feedback" class="quiz-feedback"></div>
  <button id="quiz-next" class="mc-btn green">NEXT ▶</button>
</section>

<!-- TIMELINE -->
<section id="screen-timeline" class="screen">
  <div class="section-title">THE TIMELINE</div>
  <div id="timeline-count"></div>
  <div id="timeline-rail"></div>
</section>

<div id="toast"></div>

<script src="js/presidents.js"></script>
<script src="js/pixelart.js"></script>
<script src="js/app.js"></script>
</body>
</html>
